# The Person 3 data platform. Everything except the frontend starts here.
#
#   docker compose up -d           mosquitto + timescaledb + redis + api
#   docker compose logs -f api     watch ingestion
#
# The API owns the simulator, so there is no separate simulator container:
# start it with POST /api/simulation/start once the stack is up.
name: coldchain

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    # TimescaleDB is PostgreSQL with the extension already present. Swap the
    # image for postgres:16 and everything still works: session.py makes the
    # hypertable optional.
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: coldchain
      POSTGRES_PASSWORD: coldchain
      POSTGRES_DB: coldchain
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldchain -d coldchain"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: coldchain/Dockerfile
    ports:
      - "8100:8100"
    environment:
      COLDCHAIN_MQTT_HOST: mosquitto
      COLDCHAIN_DATABASE_URL: postgresql+psycopg://coldchain:coldchain@db:5432/coldchain
      COLDCHAIN_REDIS_URL: redis://redis:6379/0
      COLDCHAIN_API_PORT: "8100"
    depends_on:
      mosquitto:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  dbdata:
